events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server {
    listen 80;

    location /api/ {
      proxy_set_header Host $host;
      proxy_pass http://backend:3000/;
    }

    location / {
      proxy_set_header Host $host;
      proxy_pass http://app:80;
    }
  }
}
